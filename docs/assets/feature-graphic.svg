      <stop offset="100%" stop-color="#55F5A0" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="0" y="0" width="1024" height="500" fill="#020403"/>
  <rect x="0" y="0" width="1024" height="500" fill="url(#glow)"/>

